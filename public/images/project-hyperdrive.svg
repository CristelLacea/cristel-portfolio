<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070b"/>
      <stop offset="100%" stop-color="#0d111a"/>
    </linearGradient>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg3)"/>
  
  <!-- Speed lines -->
  <line x1="-100" y1="200" x2="1400" y2="280" stroke="url(#speedGrad)" stroke-width="4" transform="rotate(-5 640 360)"/>
  <line x1="-100" y1="320" x2="1400" y2="400" stroke="url(#speedGrad)" stroke-width="8" transform="rotate(-8 640 360)"/>
  <line x1="-100" y1="440" x2="1400" y2="520" stroke="url(#speedGrad)" stroke-width="3" transform="rotate(-6 640 360)"/>
  <line x1="-100" y1="560" x2="1400" y2="640" stroke="url(#speedGrad)" stroke-width="6" transform="rotate(-4 640 360)"/>
  
  <rect x="580" y="200" width="120" height="280" rx="20" fill="#0f172a" stroke="#00f0ff" stroke-width="3"/>
  <line x1="580" y1="250" x2="700" y2="250" stroke="#00f0ff" stroke-width="1.5"/>
  <line x1="580" y1="430" x2="700" y2="430" stroke="#00f0ff" stroke-width="1.5"/>
  <text x="640" y="345" font-family="'Syne', sans-serif" font-size="20" font-weight="900" fill="#00f0ff" text-anchor="middle" letter-spacing="4" transform="rotate(-90 640 345)">HYPER</text>

  <text x="640" y="550" font-family="'Syne', sans-serif" font-size="54" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">HYPERDRIVE ENERGY</text>
  <text x="640" y="595" font-family="'Space Grotesk', monospace" font-size="18" fill="#38bdf8" text-anchor="middle" letter-spacing="4">COMMERCIAL AD CAMPAIGN // DYNAMIC PACING</text>
  
  <text x="80" y="80" font-family="monospace" font-size="14" fill="#00f0ff">COMMERCIAL REEL</text>
